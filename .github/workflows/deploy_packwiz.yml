name: Deploy packwiz

on:
  push:
    branches: ["dev", "staging", 'release']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packwiz
        run: |
          curl -fL \
            "https://nightly.link/packwiz/packwiz/workflows/go/main/Linux%2064-bit%20x86.zip" \
            -o packwiz.zip

          unzip -o packwiz.zip

          chmod +x packwiz

          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run build script
        run: |
          ./publish.sh

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PACKWIZ_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          tar -C "build/modpack/${BRANCH}" -czf - . | \
            ssh "${SERVER_USER}@${SERVER_HOST}" \
              "/home/${SERVER_USER}/deploy-packwiz.sh ${BRANCH} ${SHA}"