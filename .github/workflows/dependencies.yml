name: Update dependencies

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Check for existing update PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list \
            --state open \
            --head "chore/dependencies" \
            --json number \
            --jq 'length')

          if [ "$count" -gt 0 ]; then
            echo "An update PR is already open."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No update PR is open."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.existing-pr.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packwiz
        if: steps.existing-pr.outputs.exists == 'false'
        run: |
          curl -fL \
            "https://nightly.link/packwiz/packwiz/workflows/go/main/Linux%2064-bit%20x86.zip" \
            -o packwiz.zip

          unzip -o packwiz.zip

          chmod +x packwiz

          echo "$PWD" >> "$GITHUB_PATH"

      - name: Update dependencies
        if: steps.existing-pr.outputs.exists == 'false'
        working-directory: modpack
        run: |
          packwiz update

      - name: Check for changes
        if: steps.existing-pr.outputs.exists == 'false'
        id: changes
        run: |
          if git diff --quiet; then
            echo "No dependency updates available."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Dependency updates detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create update branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git checkout -b chore/dependencies

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add modpack
          git commit -m "chore(modpack): update dependencies"
          git push --force-with-lease origin chore/dependencies

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "chore/dependencies" \
            --title "chore(modpack): update dependencies" \
            --body "This PR was automatically created by the weekly dependency update workflow."