name: Publish modpack

on:
  pull_request_target:
    types: [closed]
    branches: ["release"]

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  build:
    name: Build modpack
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.metadata.outputs.version }}
      description: ${{ steps.metadata.outputs.description }}
      file: ${{ steps.modpack.outputs.file }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Get release metadata
        id: metadata
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          VERSION="$PR_TITLE"
          DESCRIPTION="$PR_BODY"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer PR title: $VERSION"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "description<<EOF"
            echo "$DESCRIPTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install packwiz
        run: |
          curl -fL \
            "https://nightly.link/packwiz/packwiz/workflows/go/main/Linux%2064-bit%20x86.zip" \
            -o packwiz.zip

          unzip -o packwiz.zip

          chmod +x packwiz

          echo "$PWD" >> "$GITHUB_PATH"

      - name: Build modpack
        run: |
          ./build.sh

      - name: Rename modpack
        id: modpack
        shell: bash
        run: |
          set -euo pipefail

          FILE="$(find build -maxdepth 1 -type f -name '*.mrpack' -print -quit)"

          if [ -z "$FILE" ]; then
            echo "No .mrpack file found in build/"
            exit 1
          fi

          NEW_FILE="build/modoru_create-${{ steps.metadata.outputs.version }}.mrpack"

          mv "$FILE" "$NEW_FILE"

          echo "Found: $FILE"
          echo "Renamed to: $NEW_FILE"

          echo "file=$NEW_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload modpack
        uses: actions/upload-artifact@v4
        with:
          name: modpack
          path: ${{ steps.modpack.outputs.file }}
          if-no-files-found: error

  publish-modrinth:
    name: Publish to Modrinth
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download modpack
        uses: actions/download-artifact@v4
        with:
          name: modpack
          path: build

      - name: Publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ secrets.MODRINTH_PROJECT_ID }}
          version: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          changelog: ${{ needs.build.outputs.description }}
          files: build/modoru_create-${{ needs.build.outputs.version }}.mrpack
          loaders: neoforge
          game-versions: 1.21.1

  publish-github:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download modpack
        uses: actions/download-artifact@v4
        with:
          name: modpack
          path: build

      - name: Verify modpack
        shell: bash
        run: |
          set -euo pipefail

          FILE="build/modoru_create-${{ needs.build.outputs.version }}.mrpack"

          if [ ! -f "$FILE" ]; then
            echo "Modpack not found: $FILE"
            exit 1
          fi

          ls -lh "$FILE"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body: ${{ needs.build.outputs.description }}
          artifacts: build/modoru_create-${{ needs.build.outputs.version }}.mrpack
          allowUpdates: false
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}